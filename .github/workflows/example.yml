name: Example - run a Drone plugin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  run-plugin:
    runs-on: ubuntu-latest
    services:
      httpbin:
        image: mccutchen/go-httpbin
        ports:
          - 8080:8080
        env:
          LOG_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@v4

      # plugins/webhook is a real, published Drone plugin. It POSTs a JSON
      # build payload to the configured url(s). Rather than pointing it at
      # an external site, it targets the go-httpbin sidecar above over
      # localhost (run-plugin.sh runs the plugin with --network host) -
      # a locally-run httpbin-compatible echo endpoint, so no request ever
      # leaves the runner. This is an end-to-end smoke test for the
      # action: DRONE_* export, PLUGIN_* export, and the docker run all
      # have to work for this step to succeed.
      #
      # The custom header carries a value straight from this settings:
      # block (-> PLUGIN_HEADERS), so the sidecar's request log in the
      # next step is visible proof the settings actually reached the real
      # HTTP request, not just that some POST happened.
      - name: Run plugins/webhook through this action
        uses: ./
        with:
          image: plugins/webhook
          settings: |
            urls: http://localhost:8080/post
            valid_response_codes: 200
            headers: X-Drone-Varz-Demo=hello-from-drone-varz

      - name: Show what the sidecar received
        if: always()
        run: docker logs "$(docker ps -q --filter ancestor=mccutchen/go-httpbin)" --tail 100
